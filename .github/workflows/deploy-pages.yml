name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - run: npm run typecheck
      - run: npm test
      # Project pages are served from /<repo>/ — build with that base path.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Optional — set under Settings → Secrets and variables → Actions → Variables.
          VITE_KOFI_URL: ${{ vars.VITE_KOFI_URL }}
          VITE_MAKER_NAME: ${{ vars.VITE_MAKER_NAME }}
          VITE_REPO_URL: ${{ vars.VITE_REPO_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
