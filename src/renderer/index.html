<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' data: blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>TrueFreePDF — The PDF editor that's actually free</title>
    <meta name="description" content="Edit, sign, fill and rearrange PDFs in your browser — genuinely free. No sign-up, no watermark, no paywall at export. Your files never leave your device." />
    <meta name="theme-color" content="#0b0b1a" />
    <meta name="color-scheme" content="light dark" />
    <link rel="canonical" href="https://truefreepdf.com/" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />

    <!-- Link previews (WhatsApp, Facebook, LinkedIn, X, Slack, Discord…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TrueFreePDF" />
    <meta property="og:url" content="https://truefreepdf.com/" />
    <meta property="og:title" content="TrueFreePDF — The PDF editor that's actually free" />
    <meta property="og:description" content="Edit, sign, fill and rearrange PDFs in your browser. No sign-up, no watermark, no paywall at export." />
    <meta property="og:image" content="https://truefreepdf.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TrueFreePDF — the PDF editor that's actually free" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TrueFreePDF — The PDF editor that's actually free" />
    <meta name="twitter:description" content="Edit, sign, fill and rearrange PDFs in your browser. No sign-up, no watermark, no paywall at export." />
    <meta name="twitter:image" content="https://truefreepdf.com/og-image.png" />

    <!-- Search engines: a free web app (a data block — never executed, so the CSP is unaffected). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "TrueFreePDF",
        "url": "https://truefreepdf.com/",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any (web browser)",
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "Edit, sign, fill and rearrange PDFs in your browser. No sign-up, no watermark, no paywall at export. Files never leave your device."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
